version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github-actions
      - v6
    schedule:
      interval: weekly
      day: tuesday
      time: "12:00"
      timezone: Europe/Athens
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    labels:
      - dependencies
      - v6
    schedule:
      interval: weekly
      day: tuesday
      time: "12:00"
      timezone: Europe/Athens
    cooldown:
      default-days: 7
    versioning-strategy: increase
    rebase-strategy: disabled
    ignore:
      - dependency-name: "prettier-plugin-astro"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 (native compiler) is not supported yet by @astrojs/check
      # and typescript-eslint. Remove this entry once both accept it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Rolldown is pinned exactly on purpose while it is still release-candidate
      # software. Review each bump by hand.
      - dependency-name: "rolldown"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "stylelint"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  # The same updates for v5 on the v5-dev branch. Dependabot reads this file from the default branch
  # only, so v5's entries live here too. The ignore list matches v5-dev's .ncurc.json.
  - package-ecosystem: "github-actions"
    target-branch: "v5-dev"
    directory: "/"
    labels:
      - dependencies
      - github-actions
      - v5
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      v5-github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    target-branch: "v5-dev"
    directory: "/"
    labels:
      - dependencies
      - v5
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    versioning-strategy: increase
    rebase-strategy: disabled
    ignore:
      - dependency-name: "@astrojs/mdx"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@babel/cli"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@babel/core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@babel/preset-env"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@docsearch/js"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "astro"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "astro-auto-import"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eslint-config-xo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eslint-plugin-unicorn"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "hammer-simulator"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "jasmine"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jquery"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "karma-browserstack-launcher"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "karma-rollup-preprocessor"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "prettier-plugin-astro"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "sass"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "stylelint"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "vnu-jar"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      v5-production-dependencies:
        dependency-type: "production"
      v5-development-dependencies:
        dependency-type: "development"
