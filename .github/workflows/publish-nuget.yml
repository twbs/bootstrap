name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v5.3.9)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package-nuget:
    runs-on: windows-latest
    if: ${{ github.repository == 'twbs/bootstrap' && startsWith(inputs.tag || github.event.release.tag_name, 'v') }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release version
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.name -ne 'bootstrap' -or $env:RELEASE_TAG -cne "v$($package.version)") {
            throw "Release $env:RELEASE_TAG does not match $($package.name)@$($package.version)"
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Set up NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '5.x'

      - name: Pack NuGet packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $bsversion = $env:PACKAGE_VERSION
          nuget pack "nuget\bootstrap.nuspec" -Verbosity detailed -NonInteractive -BasePath . -Version $bsversion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget pack "nuget\bootstrap.sass.nuspec" -Verbosity detailed -NonInteractive -BasePath . -Version $bsversion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Log in to NuGet with trusted publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: mdo

      - name: Publish NuGet packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $bsversion = $env:PACKAGE_VERSION
          nuget push "bootstrap.$bsversion.nupkg" -Verbosity detailed -NonInteractive -Source "https://api.nuget.org/v3/index.json" -ApiKey $env:NUGET_API_KEY -SkipDuplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget push "bootstrap.sass.$bsversion.nupkg" -Verbosity detailed -NonInteractive -Source "https://api.nuget.org/v3/index.json" -ApiKey $env:NUGET_API_KEY -SkipDuplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
