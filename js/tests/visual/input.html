<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../../dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Form</title>
    <style></style>
  </head>
  <body>
    <div class="container">
      <h1>Input <small>Bootstrap Visual Test</small></h1>

      <h2>No layout</h2>

      <div class="mb-3">
        Text
        <input class="form-control">
      </div>
      <div class="mb-3">
        Email
        <input type="email" class="form-control">
      </div>
      <div class="mb-3">
        Number
        <input type="number" class="form-control">
      </div>
      <div class="mb-3">
        Date
        <input type="date" class="form-control">
      </div>

      <h2>Native date and time pickers</h2>
      <p>The picker icons must stay at the edge of each control.</p>

      <div class="mb-3">
        <label for="native-date" class="form-label">Date</label>
        <input id="native-date" type="date" class="form-control" value="2026-10-23">
      </div>
      <div class="mb-3">
        <label for="native-time" class="form-label">Time</label>
        <input id="native-time" type="time" class="form-control" value="12:30">
      </div>
      <div class="mb-3">
        <label for="native-datetime" class="form-label">Date and time</label>
        <input id="native-datetime" type="datetime-local" class="form-control" value="2026-10-23T12:30">
      </div>
      <div class="mb-3">
        <label for="native-month" class="form-label">Month</label>
        <input id="native-month" type="month" class="form-control" value="2026-10">
      </div>
      <div class="mb-3">
        <label for="native-week" class="form-label">Week</label>
        <input id="native-week" type="week" class="form-control" value="2026-W43">
      </div>

      <h2>Flex</h2>

      <div class="d-flex flex-wrap gap-3 mb-3">
        <div>
          Text
          <input class="form-control">
        </div>
        <div>
          Email
          <input type="email" class="form-control">
        </div>
        <div>
          Number
          <input type="number" class="form-control">
        </div>
        <div>
          Date
          <input type="date" class="form-control">
        </div>
      </div>

      <h2>Grid</h2>

      <div class="row mb-3">
        <div class="col">
          Text
          <input class="form-control">
        </div>
        <div class="col">
          Email
          <input type="email" class="form-control">
        </div>
        <div class="col">
          Number
          <input type="number" class="form-control">
        </div>
        <div class="col">
          Date
          <input type="date" class="form-control">
        </div>
      </div>
    </div>

    <script src="../../../dist/js/bootstrap.bundle.js" type="module"></script>
  </body>
</html>
